<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Animated liquid glass project orbit</title>
  <desc id="desc">A warm editorial spread where selected projects orbit a central glass core over flowing color.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf7ef"/><stop offset="1" stop-color="#eee5d5"/></linearGradient>
    <radialGradient id="orange" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffc08c"/><stop offset="1" stop-color="#d95d39"/></radialGradient>
    <radialGradient id="lilac" cx="30%" cy="25%" r="80%"><stop offset="0" stop-color="#e4dcff"/><stop offset="1" stop-color="#9b8ac7"/></radialGradient>
    <radialGradient id="sage" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#d1ddc2"/><stop offset="1" stop-color="#73806a"/></radialGradient>
    <radialGradient id="core" cx="30%" cy="20%" r="90%"><stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/><stop offset="0.48" stop-color="#ffffff" stop-opacity="0.36"/><stop offset="1" stop-color="#f4d4b5" stop-opacity="0.18"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.78"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.24"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.75"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <pattern id="grain" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="4" cy="7" r="0.55" fill="#6b5542" opacity="0.09"/><circle cx="15" cy="16" r="0.4" fill="#6b5542" opacity="0.08"/></pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="19"/></filter>
    <filter id="liquid" x="-40%" y="-40%" width="180%" height="180%"><feTurbulence type="fractalNoise" baseFrequency="0.007 0.012" numOctaves="2" seed="9" result="n"><animate attributeName="baseFrequency" values="0.007 0.012;0.012 0.008;0.007 0.012" dur="16s" repeatCount="indefinite"/></feTurbulence><feDisplacementMap in="SourceGraphic" in2="n" scale="25" xChannelSelector="R" yChannelSelector="B"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#5c4633" flood-opacity="0.16"/></filter>
    <path id="orbitPath" d="M600 47 A455 82 0 1 1 599.9 47"/>
    <clipPath id="frame"><rect width="1200" height="260" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="260" fill="url(#paper)"/>
    <rect width="1200" height="260" fill="url(#grain)"/>
    <g filter="url(#liquid)">
      <ellipse cx="105" cy="225" rx="190" ry="72" fill="url(#orange)" opacity="0.58"><animate attributeName="cx" values="105;175;105" dur="13s" repeatCount="indefinite"/><animate attributeName="rx" values="190;220;190" dur="13s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="595" cy="15" rx="215" ry="75" fill="url(#lilac)" opacity="0.54"><animate attributeName="cy" values="15;50;15" dur="14s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="1090" cy="218" rx="200" ry="72" fill="url(#sage)" opacity="0.48"><animate attributeName="cx" values="1090;1015;1090" dur="17s" repeatCount="indefinite"/></ellipse>
    </g>
    <text x="24" y="26" fill="#7c6958" font-size="9" font-family="Arial, sans-serif" font-weight="700" letter-spacing="2.5">IN ORBIT / SELECTED WORK</text>
    <text x="1176" y="26" text-anchor="end" fill="#7c6958" font-size="9" font-family="Arial, sans-serif" letter-spacing="2.2">KEEP EXPLORING</text>
    <ellipse cx="600" cy="135" rx="455" ry="82" fill="none" stroke="#ffffff" stroke-opacity="0.58" stroke-width="1.2" stroke-dasharray="4 9">
      <animate attributeName="stroke-dashoffset" values="0;-104" dur="12s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="600" cy="135" rx="350" ry="58" fill="none" stroke="#7c6958" stroke-opacity="0.1" stroke-width="1"/>
    <g filter="url(#shadow)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="6s" repeatCount="indefinite"/>
      <circle cx="600" cy="135" r="73" fill="url(#core)" stroke="#ffffff" stroke-opacity="0.82" stroke-width="1.4"/>
      <ellipse cx="574" cy="102" rx="38" ry="18" fill="#ffffff" opacity="0.44" transform="rotate(-18 574 102)"/>
      <circle cx="600" cy="135" r="56" fill="none" stroke="#d95d39" stroke-opacity="0.18">
        <animate attributeName="r" values="50;61;50" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.3;0.08;0.3" dur="5s" repeatCount="indefinite"/>
      </circle>
      <text x="600" y="120" text-anchor="middle" fill="#b64c2d" font-size="9" font-family="Arial, sans-serif" font-weight="700" letter-spacing="2.4">CURRENTLY</text>
      <text x="600" y="148" text-anchor="middle" fill="#2b2118" font-size="28" font-family="Georgia, 'Times New Roman', serif" font-weight="700">making</text>
      <text x="600" y="170" text-anchor="middle" fill="#4d4034" font-size="14" font-family="Georgia, 'Times New Roman', serif" font-style="italic">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.08;0.18;0.68;0.78;1" dur="8s" repeatCount="indefinite"/>
        useful little things.
      </text>
    </g>
    <g font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" filter="url(#shadow)">
      <g><animateMotion dur="24s" begin="0s" repeatCount="indefinite"><mpath xlink:href="#orbitPath"/></animateMotion><rect x="-67" y="-18" width="134" height="36" rx="18" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.85"/><circle cx="-48" cy="0" r="4" fill="#d95d39"/><text x="7" y="3.5" fill="#3e3329">CalendarDiary</text></g>
      <g><animateMotion dur="24s" begin="-4.8s" repeatCount="indefinite"><mpath xlink:href="#orbitPath"/></animateMotion><rect x="-62" y="-18" width="124" height="36" rx="18" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.85"/><circle cx="-43" cy="0" r="4" fill="#a56a3e"/><text x="7" y="3.5" fill="#3e3329">Bookkeeping</text></g>
      <g><animateMotion dur="24s" begin="-9.6s" repeatCount="indefinite"><mpath xlink:href="#orbitPath"/></animateMotion><rect x="-68" y="-18" width="136" height="36" rx="18" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.85"/><circle cx="-49" cy="0" r="4" fill="#73806a"/><text x="7" y="3.5" fill="#3e3329">Stock Monitor</text></g>
      <g><animateMotion dur="24s" begin="-14.4s" repeatCount="indefinite"><mpath xlink:href="#orbitPath"/></animateMotion><rect x="-56" y="-18" width="112" height="36" rx="18" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.85"/><circle cx="-37" cy="0" r="4" fill="#9b8ac7"/><text x="7" y="3.5" fill="#3e3329">DyDown</text></g>
      <g><animateMotion dur="24s" begin="-19.2s" repeatCount="indefinite"><mpath xlink:href="#orbitPath"/></animateMotion><rect x="-61" y="-18" width="122" height="36" rx="18" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.85"/><circle cx="-42" cy="0" r="4" fill="#d95d39"/><text x="7" y="3.5" fill="#3e3329">QuickDesk</text></g>
    </g>
    <g filter="url(#shadow)">
      <rect x="510" y="232" width="180" height="22" rx="11" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.68"/>
      <circle cx="526" cy="243" r="3" fill="#73806a"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/></circle>
      <text x="540" y="246" fill="#5c4938" font-size="8" font-family="Arial, sans-serif" font-weight="700" letter-spacing="1.4">BUILD · LEARN · SHARE</text>
    </g>
  </g>
</svg>
