<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="86" viewBox="0 0 1200 86" role="img" aria-labelledby="title desc">
  <title id="title">Editorial profile footer</title>
  <desc id="desc">Warm cream footer with a burnt orange rule and thank you message.</desc>
  <rect width="1200" height="86" rx="5" fill="#fbf7ef" stroke="#d4c5b3"/>
  <path d="M28 27H1172" stroke="#d95d39" stroke-width="2">
    <animate attributeName="stroke-dasharray" values="0 1200;1200 0" dur="4s" repeatCount="indefinite"/>
  </path>
  <circle cx="43" cy="57" r="7" fill="#d95d39"/>
  <text x="62" y="61" fill="#7c6958" font-size="10" font-family="Arial, sans-serif" letter-spacing="2.2">THANK YOU FOR READING</text>
  <text x="1156" y="61" text-anchor="end" fill="#2b2118" font-size="11" font-family="Georgia, serif" font-style="italic">See you in the next commit.</text>
</svg>
