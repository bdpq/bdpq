<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="86" viewBox="0 0 1200 86" role="img" aria-labelledby="title desc">
  <title id="title">Liquid glass editorial footer</title>
  <desc id="desc">A translucent warm footer with flowing color, a moving specular highlight and an animated orange rule.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fbf7ef"/><stop offset="1" stop-color="#eee5d5"/></linearGradient>
    <radialGradient id="orange" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffb36b"/><stop offset="1" stop-color="#d95d39"/></radialGradient>
    <radialGradient id="lilac" cx="30%" cy="25%" r="80%"><stop offset="0" stop-color="#e4dcff"/><stop offset="1" stop-color="#9b8ac7"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.72"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.2"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.8"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="190%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#5c4633" flood-opacity="0.12"/></filter>
    <clipPath id="bar"><rect x="20" y="15" width="1160" height="56" rx="28"/></clipPath>
  </defs>
  <rect width="1200" height="86" fill="url(#paper)"/>
  <g filter="url(#blur)">
    <ellipse cx="120" cy="52" rx="145" ry="42" fill="url(#orange)" opacity="0.52"><animate attributeName="cx" values="120;190;120" dur="10s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="1080" cy="34" rx="150" ry="46" fill="url(#lilac)" opacity="0.45"><animate attributeName="cx" values="1080;1010;1080" dur="12s" repeatCount="indefinite"/></ellipse>
  </g>
  <g filter="url(#shadow)">
    <rect x="20" y="15" width="1160" height="56" rx="28" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.8" stroke-width="1.2"/>
    <g clip-path="url(#bar)"><rect x="-140" y="0" width="110" height="86" fill="url(#shine)" opacity="0.65"><animateTransform attributeName="transform" type="translate" values="0 0;1450 0" dur="7s" repeatCount="indefinite"/></rect></g>
    <path d="M48 43H1180" stroke="#d95d39" stroke-width="1.5" stroke-dasharray="1200" opacity="0.72"><animate attributeName="stroke-dasharray" values="0 1200;1200 0" dur="4s" repeatCount="indefinite"/></path>
    <text x="48" y="50" fill="#7c6958" font-size="9" font-family="Arial, sans-serif" font-weight="700" letter-spacing="2.1">THANK YOU FOR READING</text>
    <text x="1152" y="50" text-anchor="end" fill="#2b2118" font-size="15" font-family="Georgia, 'Times New Roman', serif" font-style="italic">See you in the next commit.</text>
    <circle cx="1028" cy="43" r="3" fill="#d95d39"><animate attributeName="r" values="2.5;4;2.5" dur="3s" repeatCount="indefinite"/></circle>
  </g>
</svg>
