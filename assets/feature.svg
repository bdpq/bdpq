<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Selected work editorial spread</title>
  <desc id="desc">A warm magazine-style spread featuring CalendarDiary, Bookkeeping and Stock Monitor.</desc>
  <defs>
    <pattern id="grain" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="6" r="0.6" fill="#6b5542" opacity="0.1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#5c4633" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="1200" height="340" rx="6" fill="#eee5d5"/>
  <rect width="1200" height="340" rx="6" fill="url(#grain)"/>
  <g transform="translate(28 28)" filter="url(#shadow)">
    <rect width="674" height="284" fill="#fbf7ef" stroke="#cdbdab"/>
    <rect x="18" y="18" width="638" height="34" fill="#2b2118"/>
    <text x="34" y="40" fill="#fbf7ef" font-size="10" font-family="Arial, sans-serif" font-weight="700" letter-spacing="2.3">COVER STORY / 01</text>
    <text x="620" y="40" text-anchor="end" fill="#d9cbb9" font-size="9" font-family="Arial, sans-serif" letter-spacing="1.8">FLUTTER · DART</text>
    <g transform="translate(42 76)">
      <rect width="296" height="176" fill="#f3ecdf" stroke="#cdbdab"/>
      <text x="18" y="29" fill="#7c6958" font-size="9" font-family="Arial, sans-serif" letter-spacing="1.8">2026 / NOVEMBER</text>
      <g fill="#4d4034" font-size="10" font-family="Arial, sans-serif" text-anchor="middle">
        <text x="34" y="58">一</text><text x="75" y="58">二</text><text x="116" y="58">三</text><text x="157" y="58">四</text><text x="198" y="58">五</text><text x="239" y="58">六</text><text x="274" y="58">日</text>
      </g>
      <g fill="#6b5b4b" font-size="9" font-family="Arial, sans-serif" text-anchor="middle">
        <text x="34" y="82">1</text><text x="75" y="82">2</text><text x="116" y="82">3</text><text x="157" y="82">4</text><text x="198" y="82">5</text><text x="239" y="82">6</text><text x="274" y="82">7</text>
        <text x="34" y="108">8</text><text x="75" y="108">9</text><text x="116" y="108">10</text><text x="157" y="108">11</text><text x="198" y="108">12</text><text x="239" y="108">13</text><text x="274" y="108">14</text>
        <text x="34" y="134">15</text><text x="75" y="134">16</text><text x="116" y="134">17</text><text x="157" y="134">18</text><text x="198" y="134">19</text><text x="239" y="134">20</text><text x="274" y="134">21</text>
      </g>
      <circle cx="116" cy="145" r="15" fill="#d95d39"/>
      <text x="116" y="150" text-anchor="middle" fill="#fbf7ef" font-size="11" font-family="Arial, sans-serif" font-weight="700">26</text>
      <text x="157" y="150" fill="#6b5b4b" font-size="9" font-family="Arial, sans-serif">22</text><text x="198" y="150" fill="#6b5b4b" font-size="9" font-family="Arial, sans-serif">23</text><text x="239" y="150" fill="#6b5b4b" font-size="9" font-family="Arial, sans-serif">24</text><text x="274" y="150" fill="#6b5b4b" font-size="9" font-family="Arial, sans-serif">25</text>
    </g>
    <text x="380" y="105" fill="#d95d39" font-size="11" font-family="Arial, sans-serif" font-weight="700" letter-spacing="2.4">A DIARY THAT REMEMBERS</text>
    <text x="376" y="147" fill="#2b2118" font-size="34" font-family="Georgia, serif" font-weight="700">Calendar</text>
    <text x="376" y="184" fill="#2b2118" font-size="34" font-family="Georgia, serif" font-weight="700">Diary<tspan fill="#d95d39">.</tspan></text>
    <text x="380" y="219" fill="#7c6958" font-size="11" font-family="'Microsoft YaHei', Arial, sans-serif">日历、农历、多媒体日记与提醒，</text>
    <text x="380" y="238" fill="#7c6958" font-size="11" font-family="'Microsoft YaHei', Arial, sans-serif">全部留在你的设备里。</text>
  </g>
  <g transform="translate(724 28)" filter="url(#shadow)">
    <rect width="448" height="134" fill="#d95d39"/>
    <text x="22" y="28" fill="#fbe9dc" font-size="9" font-family="Arial, sans-serif" font-weight="700" letter-spacing="2.1">FIELD NOTE / 02</text>
    <text x="20" y="73" fill="#2b2118" font-size="31" font-family="Georgia, serif" font-weight="700">Bookkeeping</text>
    <text x="22" y="103" fill="#fbe9dc" font-size="11" font-family="'Microsoft YaHei', Arial, sans-serif">自动记账、离线语音、本地数据。</text>
    <g transform="translate(349 24)">
      <rect width="73" height="91" rx="8" fill="#fbf7ef"/>
      <rect x="10" y="13" width="53" height="7" rx="3" fill="#d8c8b5"/>
      <text x="12" y="43" fill="#2b2118" font-size="16" font-family="Georgia, serif" font-weight="700">¥</text>
      <path d="M12 59H62M12 69H48M12 79H56" stroke="#b7a590" stroke-width="3"/>
    </g>
  </g>
  <g transform="translate(724 178)" filter="url(#shadow)">
    <rect width="448" height="134" fill="#73806a"/>
    <text x="22" y="28" fill="#eef0e6" font-size="9" font-family="Arial, sans-serif" font-weight="700" letter-spacing="2.1">FIELD NOTE / 03</text>
    <text x="20" y="73" fill="#fbf7ef" font-size="30" font-family="Georgia, serif" font-weight="700">Stock-Monitor</text>
    <text x="22" y="103" fill="#eef0e6" font-size="11" font-family="'Microsoft YaHei', Arial, sans-serif">轻量桌面行情，离线维护版。</text>
    <g transform="translate(344 28)">
      <rect width="80" height="78" rx="4" fill="#2b2118"/>
      <path d="M10 57L24 45L35 50L49 29L60 36L71 17" fill="none" stroke="#f0b56b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M10 66H71" stroke="#6f6356" stroke-width="2"/>
    </g>
  </g>
