<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Liquid glass editorial project spread</title>
  <desc id="desc">Three floating glass feature cards for CalendarDiary, Bookkeeping and Stock Monitor.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f1e6"/><stop offset="1" stop-color="#eee3d1"/></linearGradient>
    <radialGradient id="orange" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffc08c"/><stop offset="1" stop-color="#d95d39"/></radialGradient>
    <radialGradient id="lilac" cx="30%" cy="25%" r="80%"><stop offset="0" stop-color="#e4dcff"/><stop offset="1" stop-color="#9b8ac7"/></radialGradient>
    <radialGradient id="sage" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#d1ddc2"/><stop offset="1" stop-color="#73806a"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.78"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.38"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.16"/></linearGradient>
    <linearGradient id="warmGlass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff7e9" stop-opacity="0.7"/><stop offset="1" stop-color="#f7c8a9" stop-opacity="0.22"/></linearGradient>
    <linearGradient id="greenGlass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5f9ef" stop-opacity="0.72"/><stop offset="1" stop-color="#c7d3b9" stop-opacity="0.2"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.68"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <pattern id="grain" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="4" cy="7" r="0.55" fill="#6b5542" opacity="0.09"/><circle cx="15" cy="16" r="0.4" fill="#6b5542" opacity="0.08"/></pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="liquid" x="-40%" y="-40%" width="180%" height="180%"><feTurbulence type="fractalNoise" baseFrequency="0.009" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="22" xChannelSelector="R" yChannelSelector="B"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#5c4633" flood-opacity="0.15"/></filter>
    <clipPath id="featureClip"><rect x="28" y="28" width="674" height="284" rx="24"/></clipPath>
    <clipPath id="bookClip"><rect x="724" y="28" width="448" height="134" rx="24"/></clipPath>
    <clipPath id="stockClip"><rect x="724" y="178" width="448" height="134" rx="24"/></clipPath>
    <clipPath id="frame"><rect width="1200" height="340" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#paper)"/>
    <rect width="1200" height="340" fill="url(#grain)"/>
    <g filter="url(#liquid)">
      <ellipse cx="120" cy="285" rx="190" ry="90" fill="url(#orange)" opacity="0.6"><animate attributeName="cx" values="120;180;120" dur="13s" repeatCount="indefinite"/><animate attributeName="rx" values="190;215;190" dur="13s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="1110" cy="75" rx="180" ry="105" fill="url(#lilac)" opacity="0.55"><animate attributeName="cy" values="75;115;75" dur="15s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="1000" cy="310" rx="190" ry="65" fill="url(#sage)" opacity="0.5"><animate attributeName="cx" values="1000;950;1000" dur="17s" repeatCount="indefinite"/></ellipse>
    </g>
    <text x="28" y="19" fill="#7c6958" font-size="9" font-family="Arial, sans-serif" font-weight="700" letter-spacing="2.5">COVER STORY / THREE WAYS TO MAKE EVERYDAY LIGHTER</text>
    <g filter="url(#shadow)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="7s" repeatCount="indefinite"/>
      <rect x="28" y="28" width="674" height="284" rx="24" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.78" stroke-width="1.3"/>
      <g clip-path="url(#featureClip)"><rect x="-160" y="0" width="140" height="340" fill="url(#shine)" opacity="0.48" transform="rotate(16 100 170)"><animateTransform attributeName="transform" type="translate" values="0 0;1000 0" dur="8s" repeatCount="indefinite"/></rect></g>
      <rect x="52" y="52" width="64" height="24" rx="12" fill="#d95d39" opacity="0.9"/>
      <text x="84" y="68" text-anchor="middle" fill="#fbf7ef" font-size="9" font-family="Arial, sans-serif" font-weight="700" letter-spacing="1.5">FEATURE</text>
      <text x="52" y="120" fill="#2b2118" font-size="39" font-family="Georgia, 'Times New Roman', serif" font-weight="700">CalendarDiary</text>
      <text x="54" y="150" fill="#4d4034" font-size="16" font-family="Georgia, 'Times New Roman', serif" font-style="italic">Calendar, mood, weather and life.</text>
      <text x="54" y="181" fill="#7c6958" font-size="12" font-family="'Microsoft YaHei', Arial, sans-serif">把日历、心情与天气，装进一本日常手记。</text>
      <g transform="translate(400 174)">
        <rect x="0" y="0" width="270" height="108" rx="14" fill="#ffffff" fill-opacity="0.58" stroke="#ffffff" stroke-opacity="0.8"/>
        <rect x="0" y="0" width="270" height="108" rx="14" fill="none" stroke="#c4b39d" stroke-opacity="0.55"/>
        <path d="M0 30H270" stroke="#c4b39d" stroke-opacity="0.55"/>
        <circle cx="25" cy="17" r="5" fill="#d95d39"/>
        <text x="247" y="21" text-anchor="end" fill="#7c6958" font-size="9" font-family="Consolas, monospace">AUG / 2026</text>
        <g fill="#7c6958" font-size="8" font-family="Arial, sans-serif" text-anchor="middle">
          <text x="33" y="51">M</text><text x="72" y="51">T</text><text x="111" y="51">W</text><text x="150" y="51">T</text><text x="189" y="51">F</text><text x="228" y="51">S</text><text x="259" y="51">S</text>
        </g>
        <g fill="#bcae9c" font-size="7" font-family="Arial, sans-serif" text-anchor="middle">
          <text x="33" y="70">01</text><text x="72" y="70">02</text><text x="111" y="70">03</text><text x="150" y="70">04</text><text x="189" y="70">05</text><text x="228" y="70">06</text><text x="259" y="70">07</text>
          <text x="33" y="90">08</text><text x="72" y="90">09</text><text x="111" y="90">10</text><text x="150" y="90">11</text><text x="189" y="90">12</text><text x="228" y="90">13</text><text x="259" y="90">14</text>
        </g>
        <circle cx="189" cy="87" r="13" fill="#d95d39"><animate attributeName="r" values="11;14;11" dur="4s" repeatCount="indefinite"/></circle>
        <text x="189" y="90" text-anchor="middle" fill="#fbf7ef" font-size="7" font-family="Arial, sans-serif" font-weight="700">12</text>
        <rect x="104" y="24" width="62" height="14" rx="7" fill="#e6d7f5" opacity="0.9"/>
      </g>
      <text x="54" y="287" fill="#a64a2f" font-size="9" font-family="Arial, sans-serif" font-weight="700" letter-spacing="1.7">FLUTTER / DART / SQLITE</text>
      <text x="672" y="287" text-anchor="end" fill="#7c6958" font-size="9" font-family="Arial, sans-serif">01</text>
    </g>
    <g filter="url(#shadow)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 6;0 0" dur="8s" repeatCount="indefinite"/>
      <rect x="724" y="28" width="448" height="134" rx="24" fill="url(#warmGlass)" stroke="#ffffff" stroke-opacity="0.78" stroke-width="1.3"/>
      <g clip-path="url(#bookClip)"><rect x="570" y="0" width="120" height="180" fill="url(#shine)" opacity="0.42" transform="rotate(16 700 80)"><animateTransform attributeName="transform" type="translate" values="0 0;760 0" dur="7s" begin="-2s" repeatCount="indefinite"/></rect></g>
      <text x="752" y="58" fill="#b64c2d" font-size="9" font-family="Arial, sans-serif" font-weight="700" letter-spacing="2">02 / PERSONAL FINANCE</text>
      <text x="750" y="97" fill="#2b2118" font-size="28" font-family="Georgia, 'Times New Roman', serif" font-weight="700">Bookkeeping</text>
      <text x="752" y="123" fill="#5c4938" font-size="12" font-family="Georgia, serif" font-style="italic">Small entries, clearer decisions.</text>
      <g transform="translate(1090 63)">
        <rect width="54" height="66" rx="8" fill="#ffffff" fill-opacity="0.56" stroke="#ffffff" stroke-opacity="0.8"/>
        <path d="M12 18H42M12 28H42M12 38H34" stroke="#b74a2d" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
        <path d="M11 52H44" stroke="#7c6958" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>
    <g filter="url(#shadow)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="9s" begin="-3s" repeatCount="indefinite"/>
      <rect x="724" y="178" width="448" height="134" rx="24" fill="url(#greenGlass)" stroke="#ffffff" stroke-opacity="0.78" stroke-width="1.3"/>
      <g clip-path="url(#stockClip)"><rect x="580" y="0" width="110" height="180" fill="url(#shine)" opacity="0.4" transform="rotate(16 700 240)"><animateTransform attributeName="transform" type="translate" values="0 0;720 0" dur="8s" begin="-4s" repeatCount="indefinite"/></rect></g>
      <text x="752" y="207" fill="#5f6f58" font-size="9" font-family="Arial, sans-serif" font-weight="700" letter-spacing="2">03 / DESKTOP MONITOR</text>
      <text x="750" y="246" fill="#2b2118" font-size="28" font-family="Georgia, 'Times New Roman', serif" font-weight="700">Stock Monitor</text>
      <text x="752" y="272" fill="#4f5d48" font-size="12" font-family="Georgia, serif" font-style="italic">A quiet pulse on your portfolio.</text>
      <g transform="translate(1090 214)">
        <rect width="54" height="66" rx="8" fill="#ffffff" fill-opacity="0.56" stroke="#ffffff" stroke-opacity="0.8"/>
        <polyline points="8,49 16,41 23,45 31,30 38,35 47,19" fill="none" stroke="#647b59" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <animate attributeName="points" values="8,49 16,41 23,45 31,30 38,35 47,19;8,46 16,48 23,37 31,40 38,28 47,21;8,49 16,41 23,45 31,30 38,35 47,19" dur="5s" repeatCount="indefinite"/>
        </polyline>
      </g>
    </g>
  </g>
</svg>
