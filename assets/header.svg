<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">bdpq warm editorial profile banner</title>
  <desc id="desc">Cream paper background, serif typography, burnt orange accents and an abstract magazine cover motif.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf7ef"/>
      <stop offset="1" stop-color="#eee5d5"/>
    </linearGradient>
    <pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="5" r="0.7" fill="#6b5542" opacity="0.12"/>
      <circle cx="17" cy="14" r="0.5" fill="#6b5542" opacity="0.09"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#5c4633" flood-opacity="0.12"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="320" rx="8"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#paper)"/>
    <rect width="1200" height="320" fill="url(#grain)"/>
    <path d="M52 36H1148M52 284H1148" stroke="#cdbdab" stroke-width="1"/>
    <text x="54" y="25" fill="#7c6958" font-size="10" font-family="Arial, sans-serif" letter-spacing="2.4">PERSONAL JOURNAL / ISSUE 01</text>
    <text x="1146" y="25" text-anchor="end" fill="#7c6958" font-size="10" font-family="Arial, sans-serif" letter-spacing="2.4">CODE · TOOLS · EVERYDAY PROBLEMS</text>
    <rect x="54" y="62" width="5" height="176" fill="#d95d39"/>
    <text x="82" y="89" fill="#d95d39" font-size="12" font-family="Arial, sans-serif" font-weight="700" letter-spacing="3.2">HELLO, I AM</text>
    <text x="76" y="177" fill="#2b2118" font-size="92" font-family="Georgia, 'Times New Roman', serif" font-weight="700" letter-spacing="-5">bdpq<tspan fill="#d95d39">.</tspan></text>
    <text x="82" y="215" fill="#4d4034" font-size="18" font-family="Georgia, 'Times New Roman', serif" font-style="italic">Notes on code, craft and useful little things.</text>
    <text x="82" y="248" fill="#7c6958" font-size="13" font-family="'Microsoft YaHei', Arial, sans-serif">把日常问题，做成顺手的产品。</text>
    <g transform="translate(850 55)" filter="url(#shadow)">
      <rect width="294" height="210" rx="3" fill="#2b2118"/>
      <rect x="15" y="15" width="264" height="180" fill="#f4ecdf"/>
      <circle cx="244" cy="82" r="42" fill="#d95d39">
        <animate attributeName="r" values="40;44;40" dur="8s" repeatCount="indefinite"/>
      </circle>
      <path d="M39 150H253M39 162H214M39 174H238" stroke="#b7a590" stroke-width="2"/>
      <text x="39" y="49" fill="#2b2118" font-size="11" font-family="Arial, sans-serif" font-weight="700" letter-spacing="2">THE MAKING OF</text>
      <text x="36" y="101" fill="#2b2118" font-size="36" font-family="Georgia, 'Times New Roman', serif" font-weight="700">USEFUL</text>
      <text x="36" y="136" fill="#2b2118" font-size="36" font-family="Georgia, 'Times New Roman', serif" font-weight="700">THINGS</text>
      <text x="244" y="89" text-anchor="middle" fill="#fbf7ef" font-size="21" font-family="Georgia, serif" font-style="italic">01</text>
    </g>
    <text x="54" y="307" fill="#7c6958" font-size="10" font-family="Arial, sans-serif" letter-spacing="2.2">ANDROID / FLUTTER / DESKTOP</text>
    <text x="1146" y="307" text-anchor="end" fill="#d95d39" font-size="10" font-family="Arial, sans-serif" font-weight="700" letter-spacing="2.2">EST. 2012</text>
  </g>
</svg>
